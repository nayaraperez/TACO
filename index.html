<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="NayaraPérez">
    <title>Taco Palace</title>
    <link rel="stylesheet" href="20_TACO_PALACE/static/css/style.css">
</head>

<body>

    <header>
        <nav class="barra">
            <div class="logo_taco">
                <img src="20_TACO_PALACE/static/img/Imágenes/logo.png" alt="Logo">
                <h1><span class="texto_naranja">Taco</span>Palace</h1>
            </div>

            <div class="logo_carrito">
                <div class="barra_busqueda">
                    <input type="text" id="usuario" placeholder="email">
                    <button class="boton_naranja">Login</button>
                </div>
                <div class="carrito_cero">
                    <img src="20_TACO_PALACE/static/img/Imágenes/carrito.png" alt="Carrito">
                    <span>0</span>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <!-- Categorías superiores -->
        <nav class="menu_arriba">
            <ul>
                <li class="foto_comida">
                    <img src="20_TACO_PALACE/static/img/Imágenes/enchiladas.jpg" alt="Enchiladas">
                    <p>Enchiladas</p>
                </li>
                <li class="foto_comida">
                    <img src="20_TACO_PALACE/static/img/Imágenes/tacos.jpg" alt="Tacos">
                    <p>Tacos</p>
                </li>
                <li class="foto_comida">
                    <img src="20_TACO_PALACE/static/img/Imágenes/flautas.jpg" alt="Flautas">
                    <p>Flautas</p>
                </li>
                <li class="foto_comida">
                    <img src="20_TACO_PALACE/static/img/Imágenes/gorditas.jpg" alt="Gorditas">
                    <p>Gorditas</p>
                </li>
                <li class="foto_comida">
                    <img src="20_TACO_PALACE/static/img/Imágenes/tostadas.jpg" alt="Tostadas">
                    <p>Tostadas</p>
                </li>
                <li class="foto_comida">
                    <img src="20_TACO_PALACE/static/img/Imágenes/enfrijoladas.jpg" alt="Enfrijoladas">
                    <p>Enfrijoladas</p>
                </li>
            </ul>
        </nav>

        <section class="seccion_intermedia">
            <!--izquierdo -->
            <section class="section_izquerda">
                <div class="texto_grande">
                    <h2>
                        La mejor<br>
                        variedad en<br>
                        platillos de<br>
                        comida<br>
                        <span class="texto_negrita">mexicana</span>
                    </h2>
                    <p>
                        Contamos con<br>
                        <a href="#">servicio</a> a<br>
                        <span class="texto_naranja">domicilio</span>
                    </p>
                </div>
                <img src="20_TACO_PALACE/static/img/Imágenes/comida-mexicana.jpg" alt="Comida Mexicana">
            </section>

            <!-- Recomendados derecho -->
            <section class="section_derecha">
                <h3>Recomendados:</h3>

                <div class="caja">
                    <img src="20_TACO_PALACE/static/img/Imágenes/orden-tacos.jpg" alt="Orden de Tacos">
                    <div class="caja_parrafo_inferior">
                        <div>
                            <p>Orden de Tacos</p>
                            <a href="#">Ver Más...</a>
                        </div>
                        <button class="Mas">+</button>
                    </div>
                </div>

                <div class="caja">
                    <img src="20_TACO_PALACE/static/img/Imágenes/orden-flautas.jpg" alt="Orden de Flautas">
                    <div class="caja_parrafo_inferior">
                        <div>
                            <p>Orden de Flautas</p>
                            <a href="#">Ver Más...</a>
                        </div>
                        <button class="Mas">+</button>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <script src="20_TACO_PALACE/static/js/script.js"></script>
</body>

</html>
